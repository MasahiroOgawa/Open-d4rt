[project]
name = "open-d4rt"
version = "0.1.0"
description = "OpenD4RT - unofficial PyTorch/GPU implementation of D4RT for 4D reconstruction and tracking"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==2.2.5",
    "PyYAML==6.0.3",
    "opencv-python-headless==4.13.0.92",
    "imageio==2.37.3",
    "pillow==12.1.1",
    "matplotlib==3.10.8",
    "tqdm==4.67.3",
    "tensorboard==2.20.0",
    "lz4==4.4.5",
    # Not in requirements.txt but imported by the code paths below; without them the
    # eval entry points fail at import rather than at use:
    #   src/eval/*            -> einops
    #   checkpoint download   -> huggingface-hub
    #   viser visualisation   -> viser (optional, see [project.optional-dependencies])
    "einops>=0.8",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
viz = ["viser>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# requirements.txt pins the +cu124 local version via --extra-index-url, which pip
# understands but a plain dependency string does not. uv expresses the same thing as an
# explicit index: the version stays 2.6.0 and the CUDA build comes from the index.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
